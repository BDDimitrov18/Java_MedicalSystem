<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(content=~{::content}, pageTitle='Diagnosis Form')}">
<body>
<div th:fragment="content">
    <h2 th:text="${diagnosis.id != null ? 'Edit Diagnosis' : 'Add Diagnosis'}">Diagnosis Form</h2>

    <div class="card mt-3">
        <div class="card-body">
            <form th:action="${diagnosis.id != null ? '/diagnoses/' + diagnosis.id + '/edit' : '/diagnoses/new'}"
                  th:object="${diagnosis}" method="post">
                <div class="mb-3">
                    <label class="form-label">Code (e.g. ICD-10) *</label>
                    <input type="text" th:field="*{code}" class="form-control"
                           th:classappend="${#fields.hasErrors('code')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{code}"></div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Description *</label>
                    <input type="text" th:field="*{description}" class="form-control"
                           th:classappend="${#fields.hasErrors('description')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{description}"></div>
                </div>
                <button type="submit" class="btn btn-primary">Save</button>
                <a th:href="@{/diagnoses}" class="btn btn-secondary ms-2">Cancel</a>
            </form>
        </div>
    </div>
</div>
</body>
</html>
