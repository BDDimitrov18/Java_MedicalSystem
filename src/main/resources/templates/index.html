<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout :: layout(content=~{::content}, pageTitle='Dashboard')}">
<body>
<div th:fragment="content">
    <h2 class="mb-4"><i class="bi bi-house-heart"></i> Dashboard</h2>

    <div class="row g-3">
        <div class="col-md-4" sec:authorize="hasAnyRole('ADMIN','DOCTOR')">
            <a th:href="@{/doctors}" class="text-decoration-none">
                <div class="card text-white bg-primary h-100">
                    <div class="card-body d-flex align-items-center gap-3">
                        <i class="bi bi-person-badge fs-1"></i>
                        <div><h5 class="card-title mb-0">Doctors</h5></div>
                    </div>
                </div>
            </a>
        </div>
        <div class="col-md-4" sec:authorize="hasAnyRole('ADMIN','DOCTOR')">
            <a th:href="@{/patients}" class="text-decoration-none">
                <div class="card text-white bg-success h-100">
                    <div class="card-body d-flex align-items-center gap-3">
                        <i class="bi bi-people fs-1"></i>
                        <div><h5 class="card-title mb-0">Patients</h5></div>
                    </div>
                </div>
            </a>
        </div>
        <div class="col-md-4" sec:authorize="hasAnyRole('ADMIN','DOCTOR')">
            <a th:href="@{/diagnoses}" class="text-decoration-none">
                <div class="card text-white bg-info h-100">
                    <div class="card-body d-flex align-items-center gap-3">
                        <i class="bi bi-clipboard2-pulse fs-1"></i>
                        <div><h5 class="card-title mb-0">Diagnoses</h5></div>
                    </div>
                </div>
            </a>
        </div>
        <div class="col-md-4">
            <a th:href="@{/examinations}" class="text-decoration-none">
                <div class="card text-white bg-warning h-100">
                    <div class="card-body d-flex align-items-center gap-3">
                        <i class="bi bi-journal-medical fs-1"></i>
                        <div><h5 class="card-title mb-0">Examinations</h5></div>
                    </div>
                </div>
            </a>
        </div>
        <div class="col-md-4">
            <a th:href="@{/sickleaves}" class="text-decoration-none">
                <div class="card text-white bg-danger h-100">
                    <div class="card-body d-flex align-items-center gap-3">
                        <i class="bi bi-file-medical fs-1"></i>
                        <div><h5 class="card-title mb-0">Sick Leaves</h5></div>
                    </div>
                </div>
            </a>
        </div>
        <div class="col-md-4" sec:authorize="hasAnyRole('ADMIN','DOCTOR')">
            <a th:href="@{/statistics}" class="text-decoration-none">
                <div class="card text-white bg-secondary h-100">
                    <div class="card-body d-flex align-items-center gap-3">
                        <i class="bi bi-bar-chart fs-1"></i>
                        <div><h5 class="card-title mb-0">Statistics</h5></div>
                    </div>
                </div>
            </a>
        </div>
    </div>
</div>
</body>
</html>
