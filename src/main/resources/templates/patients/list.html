<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout :: layout(content=~{::content}, pageTitle='Patients')}">
<body>
<div th:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2><i class="bi bi-people"></i> Patients</h2>
        <a th:href="@{/patients/new}" class="btn btn-primary" sec:authorize="hasRole('ADMIN')">
            <i class="bi bi-plus-lg"></i> Add Patient
        </a>
    </div>

    <div class="card">
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                    <tr>
                        <th>Name</th>
                        <th>EGN</th>
                        <th>Personal Doctor</th>
                        <th>Insured</th>
                        <th sec:authorize="hasRole('ADMIN')">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="patient : ${patients}">
                        <td><a th:href="@{/patients/{id}(id=${patient.id})}" th:text="${patient.name}"></a></td>
                        <td th:text="${patient.egn}"></td>
                        <td th:text="${patient.personalDoctor.name}"></td>
                        <td>
                            <span th:if="${patient.healthInsured}" class="badge bg-success">Yes</span>
                            <span th:unless="${patient.healthInsured}" class="badge bg-danger">No</span>
                        </td>
                        <td sec:authorize="hasRole('ADMIN')">
                            <a th:href="@{/patients/{id}/edit(id=${patient.id})}" class="btn btn-sm btn-outline-secondary">
                                <i class="bi bi-pencil"></i>
                            </a>
                            <form th:action="@{/patients/{id}/delete(id=${patient.id})}" method="post" class="d-inline"
                                  onsubmit="return confirm('Delete this patient?')">
                                <button type="submit" class="btn btn-sm btn-outline-danger">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(patients)}">
                        <td colspan="5" class="text-center text-muted">No patients found.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
