<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - Medical Records</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container d-flex justify-content-center align-items-center" style="min-height: 100vh;">
    <div class="card shadow" style="width: 400px;">
        <div class="card-header bg-primary text-white text-center">
            <h4><i class="bi bi-heart-pulse-fill"></i> Medical Records</h4>
        </div>
        <div class="card-body p-4">
            <div th:if="${param.error}" class="alert alert-danger">
                Invalid username or password.
            </div>
            <div th:if="${param.logout}" class="alert alert-info">
                You have been logged out.
            </div>
            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" name="username" class="form-control" required autofocus>
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Login</button>
            </form>
            <div class="mt-4">
                <p class="text-muted small mb-2"><strong>Demo accounts — click to fill:</strong></p>
                <div class="d-flex flex-column gap-2">
                    <button type="button" class="btn btn-outline-danger btn-sm text-start"
                            onclick="fillLogin('admin','admin123')">
                        <strong>admin</strong> / admin123 &nbsp;<span class="badge bg-danger">Admin</span>
                    </button>
                    <button type="button" class="btn btn-outline-primary btn-sm text-start"
                            onclick="fillLogin('dr.petrov','doctor123')">
                        <strong>dr.petrov</strong> / doctor123 &nbsp;<span class="badge bg-primary">Doctor</span>
                    </button>
                    <button type="button" class="btn btn-outline-primary btn-sm text-start"
                            onclick="fillLogin('dr.georgieva','doctor123')">
                        <strong>dr.georgieva</strong> / doctor123 &nbsp;<span class="badge bg-primary">Doctor</span>
                    </button>
                    <button type="button" class="btn btn-outline-success btn-sm text-start"
                            onclick="fillLogin('g.stoev','patient123')">
                        <strong>g.stoev</strong> / patient123 &nbsp;<span class="badge bg-success">Patient</span>
                    </button>
                    <button type="button" class="btn btn-outline-success btn-sm text-start"
                            onclick="fillLogin('a.kostadinova','patient123')">
                        <strong>a.kostadinova</strong> / patient123 &nbsp;<span class="badge bg-success">Patient</span>
                    </button>
                </div>
            </div>
            <script>
                function fillLogin(u, p) {
                    document.querySelector('input[name=username]').value = u;
                    document.querySelector('input[name=password]').value = p;
                }
            </script>
        </div>
    </div>
</div>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</body>
</html>
