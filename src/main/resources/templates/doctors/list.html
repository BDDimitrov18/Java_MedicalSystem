<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout :: layout(content=~{::content}, pageTitle='Doctors')}">
<body>
<div th:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2><i class="bi bi-person-badge"></i> Doctors</h2>
        <a th:href="@{/doctors/new}" class="btn btn-primary" sec:authorize="hasRole('ADMIN')">
            <i class="bi bi-plus-lg"></i> Add Doctor
        </a>
    </div>

    <div class="card">
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                    <tr>
                        <th>ID Number</th>
                        <th>Name</th>
                        <th>Specialty</th>
                        <th>GP</th>
                        <th sec:authorize="hasRole('ADMIN')">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="doctor : ${doctors}">
                        <td th:text="${doctor.identificationNumber}"></td>
                        <td><a th:href="@{/doctors/{id}(id=${doctor.id})}" th:text="${doctor.name}"></a></td>
                        <td th:text="${doctor.specialty}"></td>
                        <td>
                            <span th:if="${doctor.canBeGp}" class="badge bg-success">Yes</span>
                            <span th:unless="${doctor.canBeGp}" class="badge bg-secondary">No</span>
                        </td>
                        <td sec:authorize="hasRole('ADMIN')">
                            <a th:href="@{/doctors/{id}/edit(id=${doctor.id})}" class="btn btn-sm btn-outline-secondary">
                                <i class="bi bi-pencil"></i>
                            </a>
                            <form th:action="@{/doctors/{id}/delete(id=${doctor.id})}" method="post" class="d-inline"
                                  onsubmit="return confirm('Delete this doctor?')">
                                <button type="submit" class="btn btn-sm btn-outline-danger">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(doctors)}">
                        <td colspan="5" class="text-center text-muted">No doctors found.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
