<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout :: layout(content=~{::content}, pageTitle='Patient Record')}">
<body>
<div th:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2><i class="bi bi-person-circle"></i> <span th:text="${patient.name}"></span></h2>
        <div>
            <a th:href="@{/patients/{id}/edit(id=${patient.id})}" class="btn btn-outline-secondary me-1"
               sec:authorize="hasRole('ADMIN')">
                <i class="bi bi-pencil"></i> Edit
            </a>
            <a th:href="@{/patients}" class="btn btn-secondary" sec:authorize="hasAnyRole('ADMIN','DOCTOR')">Back</a>
            <a th:href="@{/}" class="btn btn-secondary" sec:authorize="hasRole('PATIENT')">Dashboard</a>
        </div>
    </div>

    <div class="card mb-4">
        <div class="card-header"><strong>Patient Details</strong></div>
        <div class="card-body">
            <dl class="row mb-0">
                <dt class="col-sm-3">EGN</dt>
                <dd class="col-sm-9" th:text="${patient.egn}"></dd>
                <dt class="col-sm-3">Personal Doctor</dt>
                <dd class="col-sm-9" th:text="${patient.personalDoctor.name}"></dd>
                <dt class="col-sm-3">Health Insurance</dt>
                <dd class="col-sm-9">
                    <span th:if="${patient.healthInsured}" class="badge bg-success">Insured</span>
                    <span th:unless="${patient.healthInsured}" class="badge bg-danger">Not Insured</span>
                </dd>
            </dl>
        </div>
    </div>

    <div class="card mb-4" sec:authorize="hasRole('ADMIN')">
        <div class="card-header d-flex justify-content-between align-items-center">
            <strong><i class="bi bi-person-lock"></i> User Account</strong>
            <a th:href="@{/patients/{id}/assign-user(id=${patient.id})}"
               class="btn btn-sm btn-outline-primary">
                <i class="bi bi-pencil"></i>
                <span th:text="${linkedUser != null ? 'Edit Account' : 'Assign Account'}"></span>
            </a>
        </div>
        <div class="card-body">
            <dl class="row mb-0" th:if="${linkedUser != null}">
                <dt class="col-sm-3">Username</dt>
                <dd class="col-sm-9" th:text="${linkedUser.username}"></dd>
                <dt class="col-sm-3">Role</dt>
                <dd class="col-sm-9"><span class="badge bg-primary" th:text="${linkedUser.role}"></span></dd>
            </dl>
            <p class="text-muted mb-0" th:unless="${linkedUser != null}">No user account assigned.</p>
        </div>
    </div>

    <h4><i class="bi bi-journal-medical"></i> Examination History</h4>
    <div class="card">
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                    <tr>
                        <th>Date</th>
                        <th>Doctor</th>
                        <th>Diagnosis</th>
                        <th>Treatment</th>
                        <th>Price</th>
                        <th>Paid By</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="exam : ${examinations}">
                        <td th:text="${exam.date}"></td>
                        <td th:text="${exam.doctor.name}"></td>
                        <td th:text="${exam.diagnosis.description}"></td>
                        <td th:text="${exam.prescribedTreatment}"></td>
                        <td th:text="${exam.price + ' BGN'}"></td>
                        <td>
                            <span th:if="${exam.paidByNhif}" class="badge bg-info">NHIF</span>
                            <span th:unless="${exam.paidByNhif}" class="badge bg-warning text-dark">Patient</span>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(examinations)}">
                        <td colspan="6" class="text-center text-muted">No examinations on record.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
