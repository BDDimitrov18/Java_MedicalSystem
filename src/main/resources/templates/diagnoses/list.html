<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout :: layout(content=~{::content}, pageTitle='Diagnoses')}">
<body>
<div th:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2><i class="bi bi-clipboard2-pulse"></i> Diagnoses</h2>
        <a th:href="@{/diagnoses/new}" class="btn btn-primary" sec:authorize="hasRole('ADMIN')">
            <i class="bi bi-plus-lg"></i> Add Diagnosis
        </a>
    </div>

    <div class="card">
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                    <tr>
                        <th>Code</th>
                        <th>Description</th>
                        <th sec:authorize="hasRole('ADMIN')">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="diagnosis : ${diagnoses}">
                        <td><span class="badge bg-secondary" th:text="${diagnosis.code}"></span></td>
                        <td th:text="${diagnosis.description}"></td>
                        <td sec:authorize="hasRole('ADMIN')">
                            <a th:href="@{/diagnoses/{id}/edit(id=${diagnosis.id})}" class="btn btn-sm btn-outline-secondary">
                                <i class="bi bi-pencil"></i>
                            </a>
                            <form th:action="@{/diagnoses/{id}/delete(id=${diagnosis.id})}" method="post" class="d-inline"
                                  onsubmit="return confirm('Delete this diagnosis?')">
                                <button type="submit" class="btn btn-sm btn-outline-danger">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(diagnoses)}">
                        <td colspan="3" class="text-center text-muted">No diagnoses found.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
