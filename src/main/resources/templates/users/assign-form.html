<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(content=~{::content}, pageTitle='Assign User Account')}">
<body>
<div th:fragment="content">
    <h2>
        <i class="bi bi-person-lock"></i>
        <span th:text="${existingUsername != null ? 'Edit Account — ' : 'Assign Account — '}"></span>
        <span th:text="${entityName}"></span>
    </h2>

    <div class="card mt-3">
        <div class="card-body">
            <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>

            <form th:action="${submitUrl}" method="post">
                <div class="mb-3">
                    <label class="form-label">Username *</label>
                    <input type="text" name="username" class="form-control"
                           th:value="${existingUsername}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label"
                           th:text="${existingUsername != null ? 'New Password (leave blank to keep current)' : 'Password *'}"></label>
                    <input type="password" name="password" class="form-control"
                           th:required="${existingUsername == null}">
                </div>
                <button type="submit" class="btn btn-primary">Save</button>
                <a th:href="${backUrl}" class="btn btn-secondary ms-2">Cancel</a>
            </form>
        </div>
    </div>
</div>
</body>
</html>
