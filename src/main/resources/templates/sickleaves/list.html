<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout :: layout(content=~{::content}, pageTitle='Sick Leaves')}">
<body>
<div th:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2><i class="bi bi-file-medical"></i> Sick Leaves</h2>
        <a th:href="@{/sickleaves/new}" class="btn btn-primary" sec:authorize="hasAnyRole('ADMIN','DOCTOR')">
            <i class="bi bi-plus-lg"></i> Issue Sick Leave
        </a>
    </div>

    <div class="card">
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                    <tr>
                        <th>Patient</th>
                        <th>Doctor</th>
                        <th>Start Date</th>
                        <th>Days</th>
                        <th>End Date</th>
                        <th sec:authorize="hasAnyRole('ADMIN','DOCTOR')">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="sl : ${sickLeaves}">
                        <td th:text="${sl.examination.patient.name}"></td>
                        <td th:text="${sl.examination.doctor.name}"></td>
                        <td th:text="${sl.startDate}"></td>
                        <td th:text="${sl.numberOfDays}"></td>
                        <td th:text="${sl.startDate.plusDays(sl.numberOfDays - 1)}"></td>
                        <td sec:authorize="hasAnyRole('ADMIN','DOCTOR')">
                            <!-- Admin can edit/delete any; doctor only their own -->
                            <th:block th:if="${currentUser.role.name() == 'ADMIN'
                                             or sl.examination.doctor.id == currentUser.doctor?.id}">
                                <a th:href="@{/sickleaves/{id}/edit(id=${sl.id})}" class="btn btn-sm btn-outline-secondary">
                                    <i class="bi bi-pencil"></i>
                                </a>
                                <form th:action="@{/sickleaves/{id}/delete(id=${sl.id})}" method="post" class="d-inline"
                                      onsubmit="return confirm('Delete this sick leave?')">
                                    <button type="submit" class="btn btn-sm btn-outline-danger">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </form>
                            </th:block>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(sickLeaves)}">
                        <td colspan="6" class="text-center text-muted">No sick leaves found.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
