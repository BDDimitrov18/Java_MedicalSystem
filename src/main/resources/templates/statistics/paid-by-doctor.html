<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(content=~{::content}, pageTitle='Patient-Paid by Doctor')}">
<body>
<div th:fragment="content">
    <h2><i class="bi bi-currency-exchange"></i> Patient-Paid Examination Amounts by Doctor</h2>
    <p class="text-muted">Shows the total amount paid by uninsured patients, grouped by performing doctor.</p>

    <div class="card mt-3">
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                    <tr><th>Doctor</th><th>Specialty</th><th class="text-end">Total Patient-Paid (BGN)</th></tr>
                </thead>
                <tbody>
                    <tr th:each="entry : ${paidAmounts}">
                        <td th:text="${entry.key.name}"></td>
                        <td th:text="${entry.key.specialty}"></td>
                        <td class="text-end fw-bold" th:text="${entry.value}"></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    <a th:href="@{/statistics}" class="btn btn-secondary mt-3">Back to Statistics</a>
</div>
</body>
</html>
