<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(content=~{::content}, pageTitle='Patients by Diagnosis')}">
<body>
<div th:fragment="content">
    <h2><i class="bi bi-search"></i> Patients by Diagnosis</h2>

    <div class="card mt-3 mb-4">
        <div class="card-body">
            <form method="get" th:action="@{/statistics/by-diagnosis}" class="d-flex gap-2">
                <select name="diagnosisId" class="form-select">
                    <option value="">-- Select Diagnosis --</option>
                    <option th:each="d : ${diagnoses}" th:value="${d.id}"
                            th:text="${d.code + ' - ' + d.description}"
                            th:selected="${selectedDiagnosis != null and selectedDiagnosis.id == d.id}"></option>
                </select>
                <button type="submit" class="btn btn-primary">Search</button>
            </form>
        </div>
    </div>

    <div th:if="${patients != null}">
        <h5 th:if="${selectedDiagnosis != null}">
            Results for: <span class="badge bg-secondary" th:text="${selectedDiagnosis.code}"></span>
            <span th:text="${selectedDiagnosis.description}"></span>
        </h5>
        <div class="card">
            <div class="card-body p-0">
                <table class="table table-hover mb-0">
                    <thead class="table-light">
                        <tr><th>Name</th><th>EGN</th><th>GP</th></tr>
                    </thead>
                    <tbody>
                        <tr th:each="p : ${patients}">
                            <td th:text="${p.name}"></td>
                            <td th:text="${p.egn}"></td>
                            <td th:text="${p.personalDoctor.name}"></td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(patients)}">
                            <td colspan="3" class="text-center text-muted">No patients with this diagnosis.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <a th:href="@{/statistics}" class="btn btn-secondary mt-3">Back to Statistics</a>
</div>
</body>
</html>
