<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(content=~{::content}, pageTitle='Patients by GP')}">
<body>
<div th:fragment="content">
    <h2><i class="bi bi-person-badge"></i> Patients by General Practitioner</h2>

    <div class="card mt-3 mb-4">
        <div class="card-body">
            <form method="get" th:action="@{/statistics/by-gp}" class="d-flex gap-2">
                <select name="doctorId" class="form-select">
                    <option value="">-- Select GP --</option>
                    <option th:each="gp : ${gps}" th:value="${gp.id}"
                            th:text="${gp.name}"
                            th:selected="${selectedGp != null and selectedGp.id == gp.id}"></option>
                </select>
                <button type="submit" class="btn btn-primary">Search</button>
            </form>
        </div>
    </div>

    <div th:if="${patients != null}">
        <h5 th:if="${selectedGp != null}">Patients of: <strong th:text="${selectedGp.name}"></strong></h5>
        <div class="card">
            <div class="card-body p-0">
                <table class="table table-hover mb-0">
                    <thead class="table-light">
                        <tr><th>Name</th><th>EGN</th><th>Insured</th></tr>
                    </thead>
                    <tbody>
                        <tr th:each="p : ${patients}">
                            <td th:text="${p.name}"></td>
                            <td th:text="${p.egn}"></td>
                            <td>
                                <span th:if="${p.healthInsured}" class="badge bg-success">Yes</span>
                                <span th:unless="${p.healthInsured}" class="badge bg-danger">No</span>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(patients)}">
                            <td colspan="3" class="text-center text-muted">No patients registered with this GP.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <a th:href="@{/statistics}" class="btn btn-secondary mt-3">Back to Statistics</a>
</div>
</body>
</html>
