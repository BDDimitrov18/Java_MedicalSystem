<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout :: layout(content=~{::content}, pageTitle='Examinations')}">
<body>
<div th:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2><i class="bi bi-journal-medical"></i> Examinations</h2>
        <a th:href="@{/examinations/new}" class="btn btn-primary" sec:authorize="hasAnyRole('ADMIN','DOCTOR')">
            <i class="bi bi-plus-lg"></i> Add Examination
        </a>
    </div>

    <div class="card">
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                    <tr>
                        <th>Date</th>
                        <th>Doctor</th>
                        <th>Patient</th>
                        <th>Diagnosis</th>
                        <th>Price</th>
                        <th>Paid By</th>
                        <th sec:authorize="hasAnyRole('ADMIN','DOCTOR')">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="exam : ${examinations}">
                        <td th:text="${exam.date}"></td>
                        <td th:text="${exam.doctor.name}"></td>
                        <td th:text="${exam.patient.name}"></td>
                        <td><span class="badge bg-secondary" th:text="${exam.diagnosis.code}"></span>
                            <span th:text="${exam.diagnosis.description}"></span></td>
                        <td th:text="${exam.price + ' BGN'}"></td>
                        <td>
                            <span th:if="${exam.paidByNhif}" class="badge bg-info">NHIF</span>
                            <span th:unless="${exam.paidByNhif}" class="badge bg-warning text-dark">Patient</span>
                        </td>
                        <td sec:authorize="hasAnyRole('ADMIN','DOCTOR')">
                            <a th:href="@{/examinations/{id}/edit(id=${exam.id})}" class="btn btn-sm btn-outline-secondary">
                                <i class="bi bi-pencil"></i>
                            </a>
                            <form th:action="@{/examinations/{id}/delete(id=${exam.id})}" method="post" class="d-inline"
                                  onsubmit="return confirm('Delete this examination?')">
                                <button type="submit" class="btn btn-sm btn-outline-danger">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(examinations)}">
                        <td colspan="7" class="text-center text-muted">No examinations found.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
